name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project PS5TurkCeviriVision.xcodeproj \
            -scheme PS5TurkCeviriVision \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App
        run: |
          mkdir -p output
          cp -R ~/Library/Developer/Xcode/DerivedData/PS5TurkCeviriVision-*/Build/Products/Release-iphoneos/PS5TurkCeviriVision.app output/
          cd output
          zip -r PS5TurkCeviriVision.app.zip PS5TurkCeviriVision.app

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: PS5TurkCeviriVision
          path: output/PS5TurkCeviriVision.app.zip
