name: PS5TurkCeviriVision

options:
  bundleIdPrefix: com.cuneytbaba
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PS5TurkCeviriVision:
    type: application
    platform: iOS

    sources:
      - path: CameraTextRecognizer.swift
      - path: CameraPreview.swift
      - path: ContentView.swift
      - path: PS5TurkCeviriVisionApp.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cuneytbaba.PS5TurkCeviriVision
        INFOPLIST_KEY_NSCameraUsageDescription: "PS5 altyazılarını algılamak için kameraya ihtiyaç vardır."
        INFOPLIST_KEY_CFBundleDisplayName: "PS5 Türkçe Çeviri"
